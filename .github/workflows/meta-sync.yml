name: Meta CAPI Weekly Sync
on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests python-dotenv
      - run: python3 scripts/meta_github_sync.py --github-token "${{ secrets.GITHUB_TOKEN }}" --github-owner "afp-digitalmarketing" --github-repo "studio-yasa-meta-capi" --csv-file "yasa_capi_phone_upload.csv" --meta-pixel-id "413265851175780" --meta-token "${{ secrets.META_ACCESS_TOKEN }}"
